name: CI Pipeline

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance && format('CI performance acceptance {0}', inputs.ci_performance_acceptance_nonce) || 'CI Pipeline' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      ci_performance_acceptance:
        description: Run the controlled CI performance acceptance build
        required: false
        type: boolean
        default: false
      ci_performance_target_sha:
        description: Immutable commit SHA to test during controlled acceptance
        required: false
        type: string
        default: ""
      ci_performance_acceptance_nonce:
        description: Unique correlation token for controlled acceptance
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && format('metadata-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance && inputs.ci_performance_target_sha || github.sha }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --locked --all-targets --all-features

      - name: Set up Bun (optional)
        if: hashFiles('web/package.json') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Front-end lint (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            cd web
            bun install --frozen-lockfile
            bun run lint
          else
            echo "No web/ package; skipping"
          fi

      - name: Front-end PWA build contract (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            cd web
            bun run build
            bun run test:pwa-build-contract
          else
            echo "No web/ package; skipping"
          fi

      - name: Front-end embedded version contract test (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            cd web
            bun run test:embedded-version
          else
            echo "No web/ package; skipping"
          fi

      - name: Front-end Storybook build (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            cd web
            bun run storybook:build
          else
            echo "No web/ package; skipping"
          fi

      - name: Front-end Storybook interaction tests (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            cd web
            bunx playwright install --with-deps chromium
            bun run test:storybook
          else
            echo "No web/ package; skipping"
          fi

      - name: Front-end demo build (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            repo="${GITHUB_REPOSITORY##*/}"
            if [[ "${repo}" == "${owner}.github.io" ]]; then
              docs_base="/"
            else
              docs_base="/${repo}/"
            fi
            cd web
            DOCS_BASE="${docs_base}" bun run build:demo
          else
            echo "No web/ package; skipping"
          fi

      - name: Compute DOCS_BASE (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f docs-site/package.json ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            repo="${GITHUB_REPOSITORY##*/}"
            if [[ "${repo}" == "${owner}.github.io" ]]; then
              echo "DOCS_BASE=/" >> "$GITHUB_ENV"
            else
              echo "DOCS_BASE=/${repo}/" >> "$GITHUB_ENV"
            fi
          else
            echo "No docs-site/ package; skipping DOCS_BASE computation"
          fi

      - name: Docs site build (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f docs-site/package.json ]]; then
            bun install --cwd docs-site --frozen-lockfile
            cd docs-site
            DOCS_BASE="${DOCS_BASE:-/}" bun run build
          else
            echo "No docs-site/ package; skipping"
          fi

      - name: Assemble public docs site smoke check (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d docs-site/doc_build && -d web/storybook-static && -d web/dist-demo ]]; then
            bash ./.github/scripts/assemble-pages-site.sh docs-site/doc_build web/storybook-static web/dist-demo .tmp/pages-site
            test -f .tmp/pages-site/index.html
            test -f .tmp/pages-site/storybook/index.html
            test -f .tmp/pages-site/demo/index.html
            test -f .tmp/pages-site/demo/mockServiceWorker.js
            test -f .tmp/pages-site/storybook.html
            grep -q "${DOCS_BASE:-/}storybook.html" .tmp/pages-site/index.html
            grep -q '/demo/' .tmp/pages-site/index.html
            grep -q "${DOCS_BASE:-/}demo/assets/" .tmp/pages-site/demo/index.html
            grep -q "${DOCS_BASE:-/}demo-404-recovery.js" .tmp/pages-site/404.html
          else
            echo "docs-site/doc_build, web/storybook-static, or web/dist-demo missing; skipping"
          fi

      - name: Check quality-gates scripts
        run: |
          python3 -m py_compile \
            .github/scripts/release_backfill.py \
            .github/scripts/release_pr_comment.py \
            .github/scripts/metadata_gate.py \
            .github/scripts/check_live_quality_gates.py \
            .github/scripts/check_quality_gates_contract.py \
            .github/scripts/ci_performance_acceptance.py

      - name: Resolve trusted quality-gates sources
        id: trusted-quality-gates
        shell: bash
        run: |
          # shellcheck disable=SC2295
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-quality-gates"
          mkdir -p "$trusted_root/.github/scripts"
          paths=(
            ".github/quality-gates.json"
            ".github/scripts/check_quality_gates_contract.py"
            ".github/scripts/check_live_quality_gates.py"
            ".github/scripts/metadata_gate.py"
          )
          source_ref="HEAD"
          source_kind="current-branch"
          base_branch=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_branch="${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            queue_prefix="refs/heads/gh-readonly-queue/"
            if [[ "${GITHUB_REF}" != "${queue_prefix}"* ]]; then
              echo "::error::merge_group ref ${GITHUB_REF} must use the gh-readonly-queue/<base_branch>/... format."
              exit 1
            fi
            queue_ref="${GITHUB_REF#"$queue_prefix"}"
            if [[ "${queue_ref}" != */pr-* ]]; then
              echo "::error::Unable to derive the merge_group base branch from ${GITHUB_REF}."
              exit 1
            fi
            base_branch="${queue_ref%%/pr-*}"
            if [ -z "${base_branch}" ]; then
              echo "::error::Unable to derive the merge_group base branch from ${GITHUB_REF}."
              exit 1
            fi
          fi

          if [ -n "${base_branch}" ]; then
            git fetch --no-tags --depth=1 origin "${base_branch}"
            source_ref="origin/${base_branch}"
            source_kind="base-branch"
            if [ "${{ github.event_name }}" = "merge_group" ]; then
              source_kind="merge-group-base-branch"
            fi
            event_name="${{ github.event_name }}"
            for path in "${paths[@]}"; do
              if ! git cat-file -e "${source_ref}:$path" 2>/dev/null; then
                echo "::error::Base branch ${base_branch} does not contain the trusted quality-gates sources required for ${event_name}."
                exit 1
              fi
            done
          fi

          for path in "${paths[@]}"; do
            mkdir -p "$trusted_root/$(dirname "$path")"
            if [ "$source_ref" = "HEAD" ]; then
              cp "$path" "$trusted_root/$path"
            else
              # shellcheck disable=SC2016
              legacy_source_command='git show "${source_ref}:${path}"'
              : "$legacy_source_command"
              git show "${source_ref}:$path" > "$trusted_root/$path"
            fi
          done

          {
            echo "source_kind=$source_kind"
            echo "source_ref=$source_ref"
            echo "base_branch=${base_branch}"
            echo "trusted_root=$trusted_root"
            echo "declaration=$trusted_root/.github/quality-gates.json"
            echo "contract_script=$trusted_root/.github/scripts/check_quality_gates_contract.py"
            echo "live_script=$trusted_root/.github/scripts/check_live_quality_gates.py"
            echo "metadata_script=$trusted_root/.github/scripts/metadata_gate.py"
          } >> "$GITHUB_OUTPUT"

      - name: Quality-gates contract check
        run: |
          python3 "${{ steps.trusted-quality-gates.outputs.contract_script }}" \
            --repo-root "$PWD" \
            --declaration "${{ steps.trusted-quality-gates.outputs.declaration }}" \
            --metadata-script "${{ steps.trusted-quality-gates.outputs.metadata_script }}"

      - name: Quality-gates live rules check
        env:
          QUALITY_GATES_LIVE_RULES_MODE: require
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${{ steps.trusted-quality-gates.outputs.live_script }}" \
            --repo "${{ github.repository }}" \
            --declaration "${{ steps.trusted-quality-gates.outputs.declaration }}"

      - name: Quality gates self-tests
        run: |
          bash .github/scripts/test-quality-gates-contract.sh
          bash .github/scripts/test-ci-performance-acceptance.sh
          bash .github/scripts/test-live-quality-gates.sh
          bash .github/scripts/test-inline-metadata-workflows.sh
          bash .github/scripts/test-release-automation.sh
          bash .github/scripts/test-release-pr-comment.sh

  unit-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance && inputs.ci_performance_target_sha || github.sha }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo test
        run: cargo test --locked --all-features

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance && inputs.ci_performance_target_sha || github.sha }}

      - name: Checkout acceptance E2E tooling
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-performance-tooling

      - name: Resolve E2E source
        shell: bash
        env:
          ACCEPTANCE_ENABLED: ${{ inputs.ci_performance_acceptance }}
          ACCEPTANCE_TARGET_SHA: ${{ inputs.ci_performance_target_sha }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          summary_script="web/scripts/summarize-playwright-results.ts"
          force_json_reporter=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ACCEPTANCE_ENABLED" = "true" ]; then
            if [ -z "$ACCEPTANCE_TARGET_SHA" ] || [ "$tested_sha" != "$ACCEPTANCE_TARGET_SHA" ]; then
              echo "controlled acceptance checkout did not resolve the requested immutable SHA" >&2
              exit 1
            fi
            summary_script=".ci-performance-tooling/web/scripts/summarize-playwright-results.ts"
            force_json_reporter=true
          fi
          {
            echo "PLAYWRIGHT_TESTED_SHA=$tested_sha"
            echo "PLAYWRIGHT_SUMMARY_SCRIPT=$summary_script"
            echo "PLAYWRIGHT_FORCE_JSON_REPORTER=$force_json_reporter"
          } >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install web dependencies
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile

      - name: Install Playwright browser
        run: |
          set -euo pipefail
          cd web
          bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright
        run: |
          set -euo pipefail
          cd web
          if [ "$PLAYWRIGHT_FORCE_JSON_REPORTER" = "true" ]; then
            PLAYWRIGHT_JSON_OUTPUT_FILE="test-results/playwright-results.json" \
              bun run e2e -- --reporter=list,json
          else
            bun run e2e
          fi

      - name: Summarize Playwright results
        id: summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # summarize-playwright-results.ts is resolved from the dispatcher workflow during acceptance.
          bun "$PLAYWRIGHT_SUMMARY_SCRIPT" \
            web/test-results/playwright-results.json \
            web/test-results/playwright-summary.json

      - name: Upload Playwright results
        if: ${{ always() }}
        continue-on-error: ${{ steps.playwright.outcome == 'failure' || steps.summary.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            web/test-results/playwright-results.json
            web/test-results/playwright-summary.json
          if-no-files-found: error
          retention-days: 14

  worktree-bootstrap:
    name: Worktree Bootstrap Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance && inputs.ci_performance_target_sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache root Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-root-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-root-bun-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run worktree bootstrap smoke test
        run: bun run test:worktree-bootstrap

  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance == true)
    timeout-minutes: 25
    env:
      CI_SMOKE_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_SMOKE_IMAGE: octo-rill-ci-smoke:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_performance_acceptance && inputs.ci_performance_target_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker smoke image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.CI_SMOKE_IMAGE }}
          build-args: |
            APP_EFFECTIVE_VERSION=${{ env.CI_SMOKE_VERSION }}

      - name: Run Docker release smoke
        shell: bash
        env:
          CI_SMOKE_IMAGE: ${{ env.CI_SMOKE_IMAGE }}
          CI_SMOKE_VERSION: ${{ env.CI_SMOKE_VERSION }}
        run: |
          set -euo pipefail
          container="octo-rill-ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tmp_dir="$(mktemp -d)"
          # shellcheck disable=SC2329
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp_dir"
            exit "$status"
          }
          trap cleanup EXIT

          smoke_key="$(openssl rand -base64 32 | tr -d '\n')"
          docker run -d --rm \
            --name "$container" \
            -p 127.0.0.1::3000 \
            -e OCTORILL_ENCRYPTION_KEY_BASE64="$smoke_key" \
            -e DATABASE_URL=sqlite::memory: \
            -e GITHUB_CLIENT_ID=ci-smoke-client \
            -e GITHUB_CLIENT_SECRET=ci-smoke-secret \
            -e GITHUB_OAUTH_REDIRECT_URL=http://127.0.0.1:3000/auth/github/callback \
            "$CI_SMOKE_IMAGE" >/dev/null

          host_port=""
          for _ in $(seq 1 30); do
            host_port="$(docker port "$container" 3000/tcp 2>/dev/null | sed -n 's/.*://p' | head -n1 || true)"
            [ -n "$host_port" ] && break
            sleep 1
          done
          [ -n "$host_port" ] || { echo "Docker smoke port was not published" >&2; exit 1; }

          health_file="$tmp_dir/health.json"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 "http://127.0.0.1:${host_port}/api/health" >"$health_file"; then
              jq -e --arg version "$CI_SMOKE_VERSION" '.ok == true and .version == $version' "$health_file"
              exit 0
            fi
            sleep 1
          done
          echo "Docker smoke health endpoint did not become ready within 30 seconds" >&2
          exit 1
