name: Rust Source Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  merge_group:
    types:
      - checks_requested

concurrency:
  group: rust-source-quality-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && format('metadata-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-source-quality:
    name: Rust Source Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo directories
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/rust-source-check/target
          key: ${{ runner.os }}-cargo-rust-source-quality-${{ hashFiles('Cargo.lock', 'tools/rust-source-check/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-source-quality-
            ${{ runner.os }}-cargo-

      - name: Run Rust source-quality contract
        run: bash ./scripts/check-rust-source-quality.sh
