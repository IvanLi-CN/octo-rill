name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: ${{ github.event.workflow_run.conclusion }}
      summary: >-
        title: Release failure
        project: ${{ github.repository }}
        status: ${{ github.event.workflow_run.conclusion }}
        result: ${{ github.event.workflow_run.conclusion }}
        target_sha: ${{ github.event.workflow_run.head_sha }}
        run_url: ${{ github.event.workflow_run.html_url }}
        workflow: ${{ github.event.workflow_run.name }}
        ref: ${{ github.event.workflow_run.head_branch && format('branch: {0}', github.event.workflow_run.head_branch) || 'ref: unavailable from workflow_run payload' }}
        event: ${{ github.event.workflow_run.event }}
        run_attempt: ${{ github.event.workflow_run.run_attempt }}
        actor: ${{ github.event.workflow_run.actor.login || github.actor }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: >-
        title: Notify failed release smoke test
        project: ${{ github.repository }}
        status: failure
        result: failure
        target_sha: ${{ github.sha }}
        run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        workflow: Notify failed release
        ref: ${{ format('branch: {0}', github.ref_name) }}
        event: workflow_dispatch
        run_attempt: ${{ github.run_attempt }}
        actor: ${{ github.actor }}
        details: manual notifier smoke test
