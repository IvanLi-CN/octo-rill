# Runtime persistence cutover: the legacy SQLite modules stay readable until the
# deletion backlog removes them, so their module declarations no longer have
# callers. The PostgreSQL transport modules return `Response` by design and
# carry a few explicit-argument loaders.
"src/main.rs|allow|dead_code" = 29
